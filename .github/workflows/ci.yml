name: CI Pipeline

on:
  push:
    branches:
      - master
      - dev
      - main
  pull_request:
    branches:
      - master
      - dev
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------
  # Job 1: Frontend (Lint, Typecheck & Production Build)
  # -------------------------------------------------------------
  frontend:
    name: Frontend (Lint, Typecheck & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Typecheck
        run: npm run typecheck

      - name: Run Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://jopmivqiwaaznuogczjl.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpvcG1pdnFpd2Fhem51b2djempsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxNzA0NjMsImV4cCI6MjEwMzc0NjQ2M30.qXCflu2_UxgL8d750xfa_CfI_lJPYgh83_a_SCGFdQM' }}
          NEXT_PUBLIC_DEMO_PROJECT_ID: '1c1711c7-11f8-43f0-babe-e6a7cefe1ad4'

  # -------------------------------------------------------------
  # Job 2: Python Code Quality (Linting)
  # -------------------------------------------------------------
  python-lint:
    name: Python Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Linter
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff Lint across data/scripts and tests
        run: ruff check data/scripts tests

  # -------------------------------------------------------------
  # NOTE ON E2E PIPELINE TEST (tests/e2e/pipeline_test.py):
  # -------------------------------------------------------------
  # The end-to-end pipeline test is intentionally EXCLUDED from automated CI.
  # It validates live infrastructure (local Supabase pgvector instance, n8n ingestion
  # webhooks, and Next.js frontend server) which are not running in a lightweight CI runner.
  # tests/e2e/pipeline_test.py is designed to be executed manually/locally during integration
  # testing: `python tests/e2e/pipeline_test.py`.
