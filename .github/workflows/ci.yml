name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------
  # Job 1: Frontend Lint & Typecheck
  # -------------------------------------------------------------
  frontend:
    name: Frontend (Lint & Typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Typecheck
        run: npm run typecheck

  # -------------------------------------------------------------
  # Job 2: Python Code Quality (Linting)
  # -------------------------------------------------------------
  python-lint:
    name: Python Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Linter
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff Lint across data/scripts and tests
        run: ruff check data/scripts tests

  # -------------------------------------------------------------
  # NOTE ON E2E PIPELINE TEST (tests/e2e/pipeline_test.py):
  # -------------------------------------------------------------
  # The end-to-end pipeline test is intentionally EXCLUDED from automated CI.
  # It validates live infrastructure (local Supabase pgvector instance, n8n ingestion
  # webhooks, and Next.js frontend server) which are not running in a lightweight CI runner.
  # tests/e2e/pipeline_test.py is designed to be executed manually/locally during integration
  # testing: `python tests/e2e/pipeline_test.py`.
